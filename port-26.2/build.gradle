}

def mixinsClasses = layout.buildDirectory.dir('classes/java/mixins')
tasks.register('compileMixinsJava', JavaCompile) {
    dependsOn compileJava, processResources
    source fileTree('../src/main/java') {
        include 'com/github/alexthe666/iceandfire/world/gen/mixin/**'
    }
    classpath = sourceSets.main.compileClasspath + files(layout.buildDirectory.dir('sourceSets/main'))
    destinationDirectory = mixinsClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-proc:none'])
}
tasks.named('classes') {
    dependsOn compileMixinsJava
    doLast {
        copy {
            from tasks.named('compileMixinsJava', JavaCompile)
            into tasks.named('compileJava', JavaCompile).get().destinationDirectory
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes['MixinConfigs'] = 'iceandfire.mixins.json'
    }
}
