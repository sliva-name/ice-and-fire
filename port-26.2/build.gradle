focusedProbes.each { name, probe ->
    def output = layout.buildDirectory.dir("model-tests/${name}")
    def compileTask = tasks.register("compile${probe.main}", JavaCompile) {
        dependsOn ':citadel:classes'
        source files(probe.sources)
        classpath = sourceSets.main.compileClasspath
        destinationDirectory = output
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
        options.sourcepath = files()
        options.compilerArgs.add('-proc:none')
    }
    tasks.register("${name}Test", JavaExec) {
        dependsOn compileTask
        classpath = files(output, '../src/main/resources') + sourceSets.main.compileClasspath
        mainClass = probe.main
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
}

tasks.register('writeCompileClasspath') {
    doLast {
        file('.gradle/port-tools/compile-classpath.txt').text = sourceSets.main.compileClasspath.asPath
