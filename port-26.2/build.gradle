plugins {
    id 'java'
    // Must be applied before ForgeGradle so `minecraft.accessTransformers` is honoured.
    id 'net.minecraftforge.accesstransformers' version '5.0.3'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

version = '2.1.13-26.2-port.2'
group = 'com.github.alexthe667'
base.archivesName = 'iceandfire'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    // Official (Mojang) names. Opens the private client ID mappers used to register the
    // mod's special item model renderers and item model properties (see IafItemModelRegistry).
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config=iceandfire.mixins.json'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

// Compile the 26.1 Java tree, with port-26.2 overlays winning for files that exist here.
def overlayJava = layout.projectDirectory.dir('src/main/java').asFile
sourceSets.main.java.setSrcDirs(['src/main/java', '../src/main/java'])
sourceSets.main.java.exclude 'com/github/alexthe666/iceandfire/world/gen/mixin/**'
sourceSets.main.java.filter.exclude { FileTreeElement element ->
    def abs = element.file.absolutePath.replace('\\', '/')
    if (abs.contains('/port-26.2/src/main/java/')) {
        return false
    }
    return new File(overlayJava, element.relativePath.pathString.replace('\\', '/')).isFile()
}
sourceSets.main.resources.srcDir '../src/main/resources'
sourceSets.main.resources.srcDir '../port-26.1/src/main/resources'
sourceSets.main.resources.srcDir 'src/main/resources'
sourceSets {
    jeiApi {
        java.srcDirs = ['jei-api']
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

def forgeDep = minecraft.dependency('net.minecraftforge:forge:26.2-65.1.3')
dependencies {
    implementation forgeDep
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    implementation project(':citadel')
    // Share the same Forge dependency so run metadata is registered once.
    jeiApiImplementation forgeDep
    // No 26.2 JEI: compile against a local 1.18 plugin host so categories stay in-tree.
    implementation sourceSets.jeiApi.output
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

def overlayResources = layout.projectDirectory.dir('src/main/resources').asFile
def overlay26_1Resources = file('../port-26.1/src/main/resources')
tasks.named('processResources', Copy) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    eachFile { details ->
        def rel = details.relativePath.pathString.replace('\\', '/')
        def abs = details.file.absolutePath.replace('\\', '/')
        def overlay26_2 = abs.contains('/port-26.2/src/main/resources/')
        def overlay26_1 = abs.contains('/port-26.1/src/main/resources/')
        // 26.2 overlay wins, then 26.1 overlay, then the 1.18 copy.
        if (!overlay26_2 && new File(overlayResources, rel).isFile()) {
            details.exclude()
            return
        }
        if (!overlay26_2 && !overlay26_1 && new File(overlay26_1Resources, rel).isFile()) {
            details.exclude()
            return
        }
        def overlay = overlay26_2 || overlay26_1
        // The 1.18 SRG-name access transformer is not valid for 26.x.
        if (rel == 'META-INF/accesstransformer.cfg' && !overlay) {
            details.exclude()
        }
        if (rel.contains('/tags/items/') || rel.contains('/tags/blocks/') || rel.contains('/tags/entity_types/')) {
            details.exclude()
        }
        if (rel.contains('/recipes/') || rel.contains('/loot_tables/') || rel.contains('/advancements/')) {
            details.exclude()
        }
        // Leftover 1.18 assets: pixies are types 0-4, and ancient_stone_stairs
        // is a Fossil integration item that is not registered here.
        if (rel == 'assets/iceandfire/items/pixie_jar_5.json'
            || rel == 'assets/iceandfire/items/ancient_stone_stairs.json'
            || rel == 'assets/iceandfire/models/item/ancient_stone_stairs.json'
            || rel == 'assets/iceandfire/blockstates/pixie_jar_5.json') {
            details.exclude()
        }
        if (rel.contains('/models/tabula/') && rel != rel.toLowerCase()) {
            details.relativePath = details.relativePath.parent.append(true, details.name.toLowerCase())
        }
        // 26.x structure NBT lives at data/<ns>/structure/, not the 1.18 structures/ folder.
        if (rel.contains('/structures/')) {
            details.relativePath = RelativePath.parse(true, rel.replace('/structures/', '/structure/'))
        }
    }
    // 26.2 renamed entity predicate field `type` (`minecraft:type`) to
    // `minecraft:entity_type`. 26.1 advancements still use the old key.
    filteringCharset = 'UTF-8'
    filesMatching('data/iceandfire/advancement/**/*.json') {
        filter { String line ->
            line.replace('"type": "iceandfire:', '"minecraft:entity_type": "iceandfire:')
        }
    }
    doLast {
        def fireDir = destinationDir.toPath().resolve('assets/iceandfire/models/tabula/firedragon')
        def swim4 = fireDir.resolve('firedragon_swim4.tbl')
        if (java.nio.file.Files.isRegularFile(swim4)) {
            java.nio.file.Files.copy(swim4, fireDir.resolve('firedragon_swimming.tbl'),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            java.nio.file.Files.copy(swim4, fireDir.resolve('firedragon_swim5.tbl'),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

// A focused source-only regression probe, independent of unported entities/renderers.
// This does not change the all-source main compilation or use old mod binaries.
def hydraTestOutput = layout.buildDirectory.dir('model-tests/hydra')
tasks.register('compileHydraModelTest', JavaCompile) {
    dependsOn ':citadel:classes'
    source files(
        '../src/main/java/com/github/alexthe666/iceandfire/client/model/ICustomStatueModel.java',
        '../src/main/java/com/github/alexthe666/iceandfire/client/model/ModelHydraBody.java',
        '../src/main/java/com/github/alexthe666/iceandfire/client/model/ModelHydraHead.java',
        '../src/main/java/com/github/alexthe666/iceandfire/client/render/entity/HydraRenderState.java',
        'src/modelTest/java/HydraModelTest.java'
    )
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = hydraTestOutput
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.sourcepath = files()
    options.compilerArgs.add('-proc:none')
}
tasks.register('hydraModelTest', JavaExec) {
    dependsOn 'compileHydraModelTest'
    classpath = files(hydraTestOutput) + sourceSets.main.compileClasspath
    mainClass = 'HydraModelTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

